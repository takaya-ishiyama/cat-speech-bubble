<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff7ed" />
    <meta name="description" content="猫の写真にランダムな吹き出しを合成して保存できるWebアプリ" />
    <title>ねこ吹き出しメーカー</title>
  </head>
  <body>
    <main class="page-shell">
      <header class="hero">
        <p class="eyebrow">CAT SPEECH BUBBLE</p>
        <h1>ねこ吹き出し<br /><span>メーカー</span></h1>
        <p class="lead">猫の写真を選ぶだけ。ランダムなセリフを吹き出しとして合成し、そのまま画像として保存できます。</p>
      </header>

      <section class="panel controls" aria-label="画像編集">
        <label class="upload" id="dropZone">
          <span class="upload-icon">＋</span>
          <span><strong>猫の写真を選ぶ</strong><small>JPEG / PNG / WebP</small></span>
          <input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp" />
        </label>
        <div class="actions">
          <button id="rerollButton" class="button secondary" type="button" disabled>↻ 別のセリフ</button>
          <button id="downloadButton" class="button primary" type="button" disabled>↓ 画像を保存</button>
        </div>
        <p class="privacy">画像処理はすべて端末内で行われ、写真はサーバーへ送信されません。</p>
      </section>

      <section class="preview" aria-live="polite">
        <div id="emptyState" class="empty-state">
          <div class="cat-face">ฅ^•ﻌ•^ฅ</div>
          <p>ここに完成画像が表示されます</p>
        </div>
        <canvas id="canvas" hidden></canvas>
      </section>
    </main>
    <footer>Made for cats with very important opinions.</footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
